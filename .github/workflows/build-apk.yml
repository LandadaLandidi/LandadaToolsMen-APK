
name: Build Landada Tools Men APK

on:
  push:
    paths:
      - 'LandadaToolsMen-Android-Project.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q LandadaToolsMen-Android-Project.zip -d buildsrc

      - name: Build APK
        working-directory: buildsrc/LandadaToolsMen-Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Landada-Tools-Men-APK
          path: buildsrc/LandadaToolsMen-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
