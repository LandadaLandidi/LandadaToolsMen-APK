
name: Build Landada Tools Men APK

on:
  push:
    paths:
      - 'LandadaToolsMen-Android-Project.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project ZIP
        run: |
          test -f LandadaToolsMen-Android-Project.zip || {
            echo "ERROR: File ZIP tidak ditemukan di repository."
            exit 1
          }
          unzip -t LandadaToolsMen-Android-Project.zip

      - name: Extract project
        run: |
          mkdir -p buildsrc
          unzip -oq LandadaToolsMen-Android-Project.zip -d buildsrc
          test -f buildsrc/LandadaToolsMen-Android/app/build.gradle.kts || {
            echo "ERROR: Struktur proyek Android tidak sesuai."
            find buildsrc -maxdepth 4 -type f
            exit 1
          }

      - name: Build APK
        working-directory: buildsrc/LandadaToolsMen-Android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f buildsrc/LandadaToolsMen-Android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh buildsrc/LandadaToolsMen-Android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Landada-Tools-Men-APK
          path: buildsrc/LandadaToolsMen-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
